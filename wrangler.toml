name = "manochat"
main = "src/index.js"
compatibility_date = "2026-08-01"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "manochat-db"
database_id = "418ceda5-cf38-476d-9cb2-483ffb99040d"

[vars]
META_API_VERSION = "v26.0"
APP_ENV = "production"
PUBLIC_COMMENT_REPLY = "Te enviei no Direct! 😊"

[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

# Secrets configurados somente no deploy:
# wrangler secret put ADMIN_PASSWORD
# wrangler secret put SESSION_SECRET
# wrangler secret put META_ACCESS_TOKEN
# wrangler secret put META_VERIFY_TOKEN
# wrangler secret put META_APP_SECRET
# wrangler secret put META_IG_USER_ID
